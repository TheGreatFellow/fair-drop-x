[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/src/",
    "@uniswap/v4-core/=lib/uniswap-hooks/lib/v4-core/",
    "@uniswap/v4-periphery/=lib/uniswap-hooks/lib/v4-periphery/",
    "solmate/=lib/uniswap-hooks/lib/v4-core/lib/solmate/",
]
# No solc pin: Drop.sol builds with 0.8.28, while v4-core's PoolManager (used in the auction
# tests) is pinned to exactly 0.8.26, so Foundry picks a compiler per file.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256
